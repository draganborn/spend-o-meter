        const daysLeft = Math.max(
          1,
          Math.ceil((nextPayDate - today) / (1000 * 60 * 60 * 24))
        );

        const payments = [...paymentsContainer.children].map(div => {
          return {
            name: div.querySelector("input[type='text']").value.trim(),
            value:
